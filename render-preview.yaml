
services:
  - type: web
    name: sharp-money-tool-preview
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: REQUIRE_LOGIN
        value: "true"
      - key: ALLOW_SIGNUP
        value: "false"
      - key: ALLOWED_EMAILS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
