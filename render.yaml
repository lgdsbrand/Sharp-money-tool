# Render Blueprint: New + -> Blueprint -> pick this repo. Add the secret values in the Render dashboard.
services:
  - type: web
    name: sharp-money-tool
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: https://lgdsanalytics.vercel.app
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
